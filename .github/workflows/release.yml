name: Release CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release (bypass conventional commits)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      release_type:
        description: 'Release type (when force release is true)'
        required: false
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'

# semantic-release pushes a release commit back to the branch, so two runs must
# never overlap.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for npm trusted publishing (OIDC)
  contents: write # Required for semantic-release to push tags and commits
  issues: write # Required for semantic-release to create issues
  pull-requests: write # Required for semantic-release to comment on PRs

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      # `main` is unprotected, so the job's own token can push the release commit
      # and tags. (`LOBEHUB_BOT_APP_ID` is a lobehub/lobehub repo variable, not
      # an org one, so the bot app token cannot be minted here.)
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify package
        run: npm pack --dry-run

      - name: Force Release Commit
        if: github.event.inputs.force_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "🔧 chore(release): force ${{ github.event.inputs.release_type }} release"

      - name: Release
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The release commit must not run the commitlint hook.
          HUSKY: 0
          # No NPM_TOKEN: @semantic-release/npm publishes through npm trusted
          # publishing (OIDC). The org token's account does not own `local-replica`.
